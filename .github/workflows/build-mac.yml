# Builds the macOS version on GitHub's Mac machines and attaches it to the
# PUBLIC releases repo (kingzizou/2A-Accounting-releases).
# Runs on every version tag (v2.0.4, ...) or manually from the Actions tab.
# One-time setup: add a repository secret named RELEASES_TOKEN
#   (fine-grained token, repo = 2A-Accounting-releases, Contents: Read and write).
name: Build Mac app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (e.g. v2.0.4)'
        required: true
permissions:
  contents: read
env:
  RELEASES_REPO: kingzizou/2A-Accounting-releases
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build (Intel + Apple Silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
      - name: Attach to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "$TAG" --notes "2A Prints Accounting $TAG"
          fi
          gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber dist/*.zip dist/latest-mac.yml
